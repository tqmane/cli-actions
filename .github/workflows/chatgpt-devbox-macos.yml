name: ChatGPT Devbox - macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA to check out (blank = current/default ref)
        required: false
        type: string

concurrency:
  group: chatgpt-devbox-macos
  cancel-in-progress: true

jobs:
  devbox:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Validate required secrets
        env:
          DEVBOX_GIT_PAT: ${{ secrets.DEVBOX_GIT_PAT }}
          OPENAI_TUNNEL_ID: ${{ secrets.OPENAI_TUNNEL_ID_MACOS }}
          OPENAI_TUNNEL_API_KEY: ${{ secrets.OPENAI_TUNNEL_API_KEY_MACOS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$DEVBOX_GIT_PAT" ]] || { echo "Missing DEVBOX_GIT_PAT"; exit 1; }
          [[ -n "$OPENAI_TUNNEL_ID" ]] || { echo "Missing OPENAI_TUNNEL_ID_MACOS"; exit 1; }
          [[ -n "$OPENAI_TUNNEL_API_KEY" ]] || { echo "Missing OPENAI_TUNNEL_API_KEY_MACOS"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEVBOX_GIT_PAT }}
          ref: ${{ inputs.ref || github.ref_name }}
          persist-credentials: true

      - name: Configure Git identity and GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.DEVBOX_GIT_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "ChatGPT Devbox"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Prepare MCP environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .devbox/venv
          .devbox/venv/bin/python -m pip install --upgrade pip
          .devbox/venv/bin/python -m pip install 'mcp>=2,<3'

      - name: Install latest OpenAI tunnel-client
        shell: bash
        run: ./scripts/install_tunnel_client.sh

      - name: Start OpenAI Secure MCP Tunnel
        env:
          CONTROL_PLANE_API_KEY: ${{ secrets.OPENAI_TUNNEL_API_KEY_MACOS }}
          OPENAI_TUNNEL_ID: ${{ secrets.OPENAI_TUNNEL_ID_MACOS }}
          DEVBOX_ROOT: ${{ github.workspace }}
          DEVBOX_PLATFORM: macos
          DEVBOX_DISPLAY_NAME: GitHub Actions Devbox - macOS
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="github-actions-macos"
          MCP_COMMAND="env -u CONTROL_PLANE_API_KEY -u OPENAI_TUNNEL_ID '$GITHUB_WORKSPACE/.devbox/venv/bin/python' '$GITHUB_WORKSPACE/tools/devbox_mcp.py'"
          HEALTH_URL_FILE="$RUNNER_TEMP/openai-tunnel-macos-health.url"
          TUNNEL_LOG="$RUNNER_TEMP/openai-tunnel-macos.log"

          rm -f "$HEALTH_URL_FILE" "$TUNNEL_LOG"

          tunnel-client init \
            --sample sample_mcp_stdio_local \
            --profile "$PROFILE" \
            --tunnel-id "$OPENAI_TUNNEL_ID" \
            --mcp-command "$MCP_COMMAND"

          tunnel-client doctor --profile "$PROFILE" --explain

          tunnel-client run \
            --profile "$PROFILE" \
            --health.listen-addr 127.0.0.1:0 \
            --health.url-file "$HEALTH_URL_FILE" \
            >"$TUNNEL_LOG" 2>&1 &
          TUNNEL_PID=$!

          cleanup() {
            if kill -0 "$TUNNEL_PID" 2>/dev/null; then
              kill "$TUNNEL_PID" 2>/dev/null || true
              wait "$TUNNEL_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          trap 'cleanup; exit 130' INT
          trap 'cleanup; exit 143' TERM

          READY=0
          HEALTH_BASE=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              set +e
              wait "$TUNNEL_PID"
              STATUS=$?
              set -e
              echo "::error::tunnel-client exited before becoming ready (exit $STATUS)."
              tail -n 200 "$TUNNEL_LOG" || true
              exit "${STATUS:-1}"
            fi

            if [[ -s "$HEALTH_URL_FILE" ]]; then
              HEALTH_BASE="$(cat "$HEALTH_URL_FILE" 2>/dev/null || true)"
              if [[ -n "$HEALTH_BASE" ]] && curl -fsS --max-time 5 "${HEALTH_BASE%/}/readyz" >/dev/null; then
                READY=1
                break
              fi
            fi
            sleep 2
          done

          if [[ "$READY" -ne 1 ]]; then
            echo "::error::OpenAI Tunnel did not become ready within 120 seconds."
            if [[ -n "$HEALTH_BASE" ]]; then
              echo "--- tunnel health details ---"
              curl -sS --max-time 5 "${HEALTH_BASE%/}/health?details=true" || true
              echo
            fi
            echo "--- tunnel-client log ---"
            tail -n 200 "$TUNNEL_LOG" || true
            exit 1
          fi

          echo "::notice title=OpenAI Tunnel Ready::macOS devbox is ready for ChatGPT connector discovery."
          {
            echo "### OpenAI Tunnel - macOS"
            echo "- Status: ready"
            echo "- MCP identity: GitHub Actions Devbox - macOS"
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- tunnel health details ---"
          curl -fsS --max-time 5 "${HEALTH_BASE%/}/health?details=true" || true
          echo
          echo "macOS devbox is ready. Keeping the tunnel alive until cancellation or the 6-hour job limit."

          set +e
          wait "$TUNNEL_PID"
          STATUS=$?
          set -e
          if [[ "$STATUS" -ne 0 ]]; then
            echo "::error::tunnel-client exited unexpectedly with status $STATUS."
            tail -n 200 "$TUNNEL_LOG" || true
          fi
          exit "$STATUS"
